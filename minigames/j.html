<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Mini</title>
  <link rel="stylesheet" href="j.css">
</head>
<body>
  <div class="game-container">
    <h2>MINESWEEPER MINI</h2>
    <p class="subtitle">Jangan klik ranjau!</p>
    
    <div class="game-info">
      <span>Bendera: <span id="flagCount">5</span></span>
      <span>Skor: <span id="score">0</span></span>
      <button onclick="restartGame()">RESET</button>
    </div>
    
    <div id="mineGrid" class="mine-grid"></div>
    
    <div class="game-overlay" id="gameOverlay">
      <h2 id="overlayTitle">GAME OVER</h2>
      <p id="overlayMessage">Kena ranjau!</p>
      <button onclick="restartGame()">MAIN LAGI</button>
      <a href="../index.html">KEMBALI</a>
    </div>
  </div>
  
  <script src="j.js"></script>
</body>
</html>
