<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker Typer</title>
  <link rel="stylesheet" href="b.css">
</head>
<body>
  <div class="game-container" tabindex="0" id="gameContainer">
    <h2>HACKER TYPER</h2>
    <p class="subtitle">Ketik secepat mungkin untuk "hack"!</p>
    
    <div id="hackScreen">
      <p id="hackOutput"></p>
      <span id="cursor">|</span>
    </div>
    
    <div class="stats">
      <div>Kata: <span id="wordCount">0</span></div>
      <div>Kecepatan: <span id="wpm">0</span> WPM</div>
      <div>Waktu: <span id="timer">30</span>s</div>
    </div>
    
    <div class="game-overlay" id="gameOverlay">
      <h2>HACK BERHASIL!</h2>
      <p>Kata: <span id="finalWords">0</span> | WPM: <span id="finalWpm">0</span></p>
      <button onclick="restartGame()">COBA LAGI</button>
      <a href="../index.html">KEMBALI</a>
    </div>
  </div>
  
  <script src="b.js"></script>
</body>
</html>
