<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cipher Decoder</title>
  <link rel="stylesheet" href="g.css">
</head>
<body>
  <div class="game-container">
    <h2>CIPHER DECODER</h2>
    <p class="subtitle">Pecahkan sandi Caesar!</p>
    
    <div class="game-info">
      <span>Skor: <span id="score">0</span></span>
      <span>Level: <span id="level">1</span></span>
    </div>
    
    <div class="cipher-display">
      <p class="cipher-label">SANDI:</p>
      <p id="cipherText" class="cipher-text">...</p>
    </div>
    
    <div class="answer-section">
      <label for="answerInput">Jawaban:</label>
      <input type="text" id="answerInput" placeholder="Tulis jawaban di sini...">
      <button onclick="checkAnswer()">JAWAB</button>
    </div>
    
    <div class="game-overlay" id="gameOverlay">
      <h2>SELESAI!</h2>
      <p>Skor: <span id="finalScore">0</span></p>
      <button onclick="restartGame()">MAIN LAGI</button>
      <a href="../index.html">KEMBALI</a>
    </div>
  </div>
  
  <script src="g.js"></script>
</body>
</html>
