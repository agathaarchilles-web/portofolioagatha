<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Time</title>
  <link rel="stylesheet" href="i.css">
</head>
<body>
  <div class="game-container">
    <h2>REACTION TIME</h2>
    <p class="subtitle">Klik saat layar berubah hijau!</p>
    
    <div id="reactionArea" class="reaction-area">
      <p>Klik untuk mulai</p>
    </div>
    
    <div class="stats">
      <div>Rata-rata: <span id="avgTime">-</span> ms</div>
      <div>Terbaik: <span id="bestTime">-</span> ms</div>
      <div>Percobaan: <span id="attempts">0</span></div>
    </div>
    
    <div class="game-overlay" id="gameOverlay">
      <h2>SELESAI!</h2>
      <p>Rata-rata: <span id="finalAvg">0</span> ms | Terbaik: <span id="finalBest">0</span> ms</p>
      <button onclick="restartGame()">COBA LAGI</button>
      <a href="../index.html">KEMBALI</a>
    </div>
  </div>
  
  <script src="i.js"></script>
</body>
</html>
